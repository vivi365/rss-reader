[project]
name = "rss-reader"
version = "0.1.0"
description = "A lightweight RSS reader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "feedparser",
]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[project.scripts]
rss-reader = "app:app.run"

[tool.black]
target-version = ["py313"]
